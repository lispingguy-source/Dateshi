<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .custom-btn {
            background-color: #09090b;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .custom-btn:hover {
            background: linear-gradient(135deg, #09090b 0%, #db2777 50%, #f43f5e 100%);
            box-shadow: 0 10px 25px -5px rgba(219, 39, 119, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-pink-50 text-zinc-800 min-h-screen flex items-center justify-center p-6 selection:bg-pink-500 selection:text-white">

    <div class="max-w-md w-full bg-white border border-pink-100 rounded-3xl p-8 shadow-xl shadow-pink-500/5 text-center space-y-6">
        
        <div class="space-y-2">
            <h1 class="text-xl font-bold tracking-tight text-zinc-900">Hey there</h1>
            <p class="text-sm text-zinc-500">I have something to tell you.</p>
        </div>

        <div id="message-box" class="hidden p-4 rounded-2xl bg-pink-50 border border-pink-200 text-pink-700 font-semibold text-lg transition-all">
            Let me take your cute ass out for a date . 😏
        </div>

        <div class="pt-2 flex justify-center">
            <button onclick="revealSurprise()" id="action-btn" class="custom-btn w-full py-3.5 px-6 font-semibold rounded-2xl active:scale-95">
                Click here
            </button>
        </div>
    </div>

    <script>
        function revealSurprise() {
            const msg = document.getElementById('message-box');
            const btn = document.getElementById('action-btn');
            
            msg.classList.remove('hidden');
            
            btn.textContent = "See you there 🥂";
            btn.disabled = true;
            btn.style.opacity = "0.7";
            btn.style.cursor = "not-allowed";
        }
    </script>
</body>
</html>
